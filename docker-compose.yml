services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsechat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulsechat
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pulsechat']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: pulsechat-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ['/bin/sh', '/init/create-bucket.sh']
    volumes:
      - ./docker/minio/init/create-bucket.sh:/init/create-bucket.sh:ro
    restart: 'no'

volumes:
  postgres_data:
  minio_data:
